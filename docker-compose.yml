services:
  cloudy:
    image: ghcr.io/l8tenever/cloudy:latest
    container_name: cloudy
    restart: unless-stopped
    # Host-Netz: DNS (53) und DHCP (67) müssen direkt im Heimnetz erreichbar sein.
    network_mode: host
    # Für den Gateway-Modus: Weiterleitung einschalten (sysctl), NAT-Regeln (iptables/ip6tables), Verkehr messen (conntrack).
    privileged: true
    env_file:
      - .env
    environment:
      TZ: Europe/Berlin
    volumes:
      - ./data:/data
      # Damit bei doppelten Zeilen in .env deine (erste) gilt – siehe app/settings.py apply_env_file.
      - ./.env:/cloudy.env:ro

  # Die vier Standard-Profile stehen auch hier, damit ein Update sie nie als "orphans" löscht.
  # Weitere Profile (warp3, vpn3 …) kommen aus data/docker-compose.slots.yml – nach dem Anlegen: cloudy slots
  warp1: &warp
    image: ghcr.io/l8tenever/cloudy:warp
    container_name: cloudy-warp1
    restart: unless-stopped
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun
    sysctls:
      net.ipv4.ip_forward: "1"
      net.ipv4.conf.all.src_valid_mark: "1"
      net.ipv4.conf.all.rp_filter: "2"
      net.ipv6.conf.all.disable_ipv6: "0"
      net.ipv6.conf.default.disable_ipv6: "0"
      net.ipv6.conf.all.forwarding: "1"
    environment:
      TZ: Europe/Berlin
    volumes:
      - ./data/warp/warp1:/cloudy
    networks:
      cloudy-warp:
        ipv4_address: 172.29.86.11
        ipv6_address: fd29:86::11

  warp2:
    <<: *warp
    container_name: cloudy-warp2
    volumes:
      - ./data/warp/warp2:/cloudy
    networks:
      cloudy-warp:
        ipv4_address: 172.29.86.12
        ipv6_address: fd29:86::12

  vpn1: &vpn
    <<: *warp
    image: ghcr.io/l8tenever/cloudy:vpn
    container_name: cloudy-vpn1
    volumes:
      - ./data/warp/vpn1:/cloudy
    networks:
      cloudy-warp:
        ipv4_address: 172.29.86.21
        ipv6_address: fd29:86::21

  vpn2:
    <<: *vpn
    container_name: cloudy-vpn2
    volumes:
      - ./data/warp/vpn2:/cloudy
    networks:
      cloudy-warp:
        ipv4_address: 172.29.86.22
        ipv6_address: fd29:86::22


  # Cloudflare Tunnel: macht ausgewählte cloudy-Seiten (z. B. die 3D-Karte) von außen erreichbar – nur mit
  # Zero-Trust-Anmeldung. Den Token legt cloudy selbst ab (Einstellungen → Von außen erreichbar). Ohne Token: aus.
  tunnel:
    image: ghcr.io/l8tenever/cloudy:tunnel
    container_name: cloudy-tunnel
    restart: unless-stopped
    environment:
      TZ: Europe/Berlin
    volumes:
      - ./data/warp/tunnel:/cloudy
    networks:
      cloudy-tunnel:
        ipv4_address: 172.29.88.10

  # Speicher: HDDs als ein Pool (mergerfs), SSD als Sicherheitskopie bis zum Backup, verschlüsseltes Backup nach
  # Google Drive. Webseite: http://<server>:8091 (eigenes Passwort, beim ersten Aufruf festlegen).
  # Pool für andere Container/Freigaben: /mnt/cloudy/pool (auf dem Host). Ohne zugeordnete Platten passiert nichts.
  speicher:
    image: ghcr.io/l8tenever/cloudy:speicher
    container_name: cloudy-speicher
    restart: unless-stopped
    # Platten formatieren/einhängen und FUSE brauchen vollen Gerätezugriff.
    privileged: true
    ports:
      - "${SPEICHER_PORT:-8091}:8091"
    environment:
      TZ: Europe/Berlin
      SPEICHER_PASSWORD: ${SPEICHER_PASSWORD:-}
    volumes:
      - ./data/speicher:/data
      # Live-/dev: neue Partitionen nach dem Formatieren sind sofort sichtbar.
      - /dev:/dev
      # Nur lesend: woran der Server selbst hängt (Systemplatte wird gesperrt).
      - /proc:/host/proc:ro
      # Einhängepunkte – rshared, damit Host und andere Container Pool und Platten sehen.
      - type: bind
        source: /mnt/cloudy
        target: /mnt/cloudy
        bind:
          propagation: rshared
          create_host_path: true

networks:
  cloudy-warp:
    name: cloudy-warp
    driver_opts:
      com.docker.network.bridge.name: cloudy-warp
    enable_ipv6: true
    ipam:
      config:
        - subnet: 172.29.86.0/24
        - subnet: fd29:86::/64
  # Der Tunnel erreicht cloudy (Host-Netz des Pi) über 172.29.88.1. cloudy erkennt Tunnel-Anfragen an 172.29.88.10.
  cloudy-tunnel:
    name: cloudy-tunnel
    driver_opts:
      com.docker.network.bridge.name: cloudy-tunnel
    ipam:
      config:
        - subnet: 172.29.88.0/24
