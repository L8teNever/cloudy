services:
  cloudy:
    image: ghcr.io/l8tenever/cloudy:latest
    container_name: cloudy
    restart: unless-stopped
    # Host-Netz: DNS (53) und DHCP (67) müssen direkt im Heimnetz erreichbar sein.
    network_mode: host
    # Für den Gateway-Modus: Weiterleitung einschalten (sysctl), NAT-Regeln (iptables/ip6tables), Verkehr messen (conntrack).
    privileged: true
    env_file:
      - .env
    environment:
      TZ: Europe/Berlin
    volumes:
      - ./data:/data
    # WARP-/VPN-Container: data/docker-compose.slots.yml (Dashboard legt Profile an).
    # Nach dem Anlegen/Löschen im Dashboard: cloudy slots   (bzw. cloudy update)

networks:
  cloudy-warp:
    name: cloudy-warp
    driver_opts:
      com.docker.network.bridge.name: cloudy-warp
    enable_ipv6: true
    ipam:
      config:
        - subnet: 172.29.86.0/24
        - subnet: fd29:86::/64
