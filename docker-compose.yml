services:
  cloudy:
    image: ghcr.io/l8tenever/cloudy:latest
    container_name: cloudy
    restart: unless-stopped
    # Host-Netz: DNS (53) und DHCP (67) müssen direkt im Heimnetz erreichbar sein.
    network_mode: host
    cap_add:
      - NET_ADMIN
      - NET_RAW
      - NET_BIND_SERVICE
    env_file:
      - .env
    environment:
      TZ: Europe/Berlin
    volumes:
      - ./data:/data
