services:
  cloudy:
    image: ghcr.io/l8tenever/cloudy:latest
    container_name: cloudy
    restart: unless-stopped
    # Host-Netz: DNS (53) und DHCP (67) müssen direkt im Heimnetz erreichbar sein.
    network_mode: host
    # Für den Gateway-Modus: Weiterleitung einschalten (sysctl), NAT-Regeln (iptables/ip6tables), Verkehr messen (conntrack).
    privileged: true
    env_file:
      - .env
    environment:
      TZ: Europe/Berlin
    volumes:
      - ./data:/data

  # Cloudflare WARP: ein Container pro Account. Anmelden und Geräte zuordnen im Dashboard.
  # Ohne Token im Dashboard tut der Container nichts.
  warp1: &warp
    image: ghcr.io/l8tenever/cloudy:warp
    container_name: cloudy-warp1
    restart: unless-stopped
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun
    sysctls:
      net.ipv4.ip_forward: "1"
      net.ipv4.conf.all.src_valid_mark: "1"
      net.ipv4.conf.all.rp_filter: "2"
      net.ipv6.conf.all.disable_ipv6: "0"
      net.ipv6.conf.default.disable_ipv6: "0"
      net.ipv6.conf.all.forwarding: "1"
    environment:
      TZ: Europe/Berlin
    volumes:
      - ./data/warp/warp1:/cloudy
    networks:
      cloudy-warp:
        ipv4_address: 172.29.86.11
        ipv6_address: fd29:86::11

  warp2:
    <<: *warp
    container_name: cloudy-warp2
    volumes:
      - ./data/warp/warp2:/cloudy
    networks:
      cloudy-warp:
        ipv4_address: 172.29.86.12
        ipv6_address: fd29:86::12

  # WireGuard-VPN (z. B. Proton VPN): ein Container pro Konfiguration. .conf im Dashboard einfügen.
  vpn1: &vpn
    image: ghcr.io/l8tenever/cloudy:vpn
    container_name: cloudy-vpn1
    restart: unless-stopped
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun
    sysctls:
      net.ipv4.ip_forward: "1"
      net.ipv4.conf.all.src_valid_mark: "1"
      net.ipv4.conf.all.rp_filter: "2"
      net.ipv6.conf.all.disable_ipv6: "0"
      net.ipv6.conf.default.disable_ipv6: "0"
      net.ipv6.conf.all.forwarding: "1"
    environment:
      TZ: Europe/Berlin
    volumes:
      - ./data/warp/vpn1:/cloudy
    networks:
      cloudy-warp:
        ipv4_address: 172.29.86.21
        ipv6_address: fd29:86::21

  vpn2:
    <<: *vpn
    container_name: cloudy-vpn2
    volumes:
      - ./data/warp/vpn2:/cloudy
    networks:
      cloudy-warp:
        ipv4_address: 172.29.86.22
        ipv6_address: fd29:86::22

  # Fernzugriff aufs Dashboard über einen Cloudflare Tunnel (z. B. https://cloudy.kulbarts.com, mit Zero-Trust-Login).
  # Token im Dashboard unter Einstellungen → Fernzugriff einfügen. Ohne Token tut der Container nichts.
  tunnel:
    image: ghcr.io/l8tenever/cloudy:tunnel
    container_name: cloudy-tunnel
    restart: unless-stopped
    environment:
      TZ: Europe/Berlin
      # Übergang: früher kam der Token aus der .env. Der Token aus dem Dashboard hat Vorrang.
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:-}
    volumes:
      - ./data/warp/tunnel:/cloudy
    networks:
      cloudy-tunnel:
        ipv4_address: 172.29.88.10

networks:
  cloudy-warp:
    name: cloudy-warp
    driver_opts:
      com.docker.network.bridge.name: cloudy-warp
    enable_ipv6: true
    ipam:
      config:
        - subnet: 172.29.86.0/24
        - subnet: fd29:86::/64
  # Der Tunnel erreicht das Dashboard (Host-Netz des Pi) über 172.29.88.1. cloudy erkennt Tunnel-Anfragen an 172.29.88.10.
  cloudy-tunnel:
    name: cloudy-tunnel
    driver_opts:
      com.docker.network.bridge.name: cloudy-tunnel
    ipam:
      config:
        - subnet: 172.29.88.0/24
