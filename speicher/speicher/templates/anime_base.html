{% extends "base.html" %}
{% block title %}Anime{% endblock %}
{% block body %}
<div class="files-app" data-csrf="{{ csrf }}">
  <header class="files-top">
    <a href="/" class="files-brand"><span class="shape round primary"><span class="ms">animation</span></span><span class="title-l">Anime</span></a>
    <span style="flex:1"></span>
    {% if benutzer %}
    <span class="chip"><span class="ms">person</span>{{ benutzer }}</span>
    <form method="post" action="/logout"><input type="hidden" name="csrf" value="{{ csrf }}">
      <button class="icon-btn" title="Abmelden" aria-label="Abmelden"><span class="ms">logout</span></button></form>
    {% else %}
    <a class="btn text" href="/login"><span class="ms">login</span>Anmelden</a>
    {% endif %}
  </header>
  <main class="page files-page">
    {% block content %}{% endblock %}
  </main>
</div>
{% endblock %}
