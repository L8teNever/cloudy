{% extends "base.html" %}
{% block body %}
<div class="files-app">
  <header class="files-top">
    <a href="/" class="files-brand"><span class="shape round primary"><span class="ms">folder_open</span></span><span class="title-l">Dateien</span></a>
    <span style="flex:1"></span>
    {% if benutzer %}
    <span class="chip"><span class="ms">person</span>{{ benutzer }}</span>
    <form method="post" action="/logout"><input type="hidden" name="csrf" value="{{ csrf }}">
      <button class="icon-btn" title="Abmelden" aria-label="Abmelden"><span class="ms">logout</span></button></form>
    {% else %}
    <a class="btn text" href="/login?weiter={{ request.url.path|urlencode }}"><span class="ms">login</span>Anmelden</a>
    {% endif %}
  </header>
  <main class="page files-page">
    {% block content %}{% endblock %}
  </main>
</div>
{% endblock %}
