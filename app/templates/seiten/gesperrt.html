<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex">
  <title>cloudy – Gesperrt</title>
  {% include "teile/icons.html" %}
  {% include "teile/mein_stil.html" %}
  <style>
    .block-panel { padding: 2rem 1.5rem 1.5rem; text-align: center; }
    .block-badge {
      display: inline-flex; align-items: center; gap: .45rem; padding: .3rem .8rem; border-radius: 999px;
      background: rgba(251, 146, 60, .12); border: 1px solid rgba(251, 146, 60, .3); color: #fb923c;
      font-size: .75rem; font-weight: 700; letter-spacing: .05em; text-transform: uppercase;
    }
    .block-badge i { width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
    .block-panel h1 { margin: 1.1rem 0 .6rem; font-size: 1.6rem; letter-spacing: -.02em; }
    .block-panel p { color: var(--color-text-muted); line-height: 1.55; font-size: .95rem; }
    .block-panel p + p { margin-top: .5rem; }
    .block-site {
      display: inline-block; margin: .9rem 0 .2rem; padding: .5rem .9rem; border-radius: 14px;
      background: rgba(32, 35, 50, .65); border: 1px solid var(--color-border);
      font-family: var(--font-mono); font-size: .85rem; color: var(--color-primary); word-break: break-all;
    }
    .block-btn {
      display: block; width: 100%; margin-top: 1.4rem; padding: .85rem 1rem; border-radius: 999px;
      background: linear-gradient(90deg, #0284c7 0%, #0ea5e9 50%, #06b6d4 100%);
      color: #fff; font-weight: 700; font-size: .95rem; text-decoration: none; text-align: center;
    }
    .block-btn:hover { filter: brightness(1.08); }
  </style>
</head>
<body>
  <main class="app-container">
    <header class="app-header">
      <a class="brand" href="/mein">
        <img class="brand-logo" src="/static/cloudy.svg" width="48" height="48" alt="" aria-hidden="true">
        <span class="brand-title">cloudy</span>
      </a>
    </header>

    <section class="panel block-panel">
      <span class="block-badge"><i></i>Gesperrt</span>
      <h1>Diese Seite ist gesperrt</h1>
      <p>Der Zugriff wurde von cloudy blockiert.</p>
      {% if host %}<div class="block-site">{{ host }}</div>{% endif %}
      <p>Wenn du meinst, dass das ein Fehler ist, melde dich bei Simon.</p>
      <a class="block-btn" href="javascript:history.back()">Zurück</a>
    </section>
  </main>
</body>
</html>
