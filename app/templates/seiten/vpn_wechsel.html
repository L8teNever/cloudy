<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex">
  <title>cloudy – VPN-Wechsel</title>
  {% include "teile/icons.html" %}
  {% include "teile/mein_stil.html" %}
  <style>
    .sw-panel { padding: 2rem 1.5rem 1.5rem; text-align: center; }
    .sw-spinner {
      width: 46px; height: 46px; margin: 0 auto 1.1rem; border-radius: 50%;
      border: 4px solid rgba(125, 211, 252, .18); border-top-color: var(--color-primary);
      animation: swDreh 0.9s linear infinite;
    }
    .sw-panel.fertig .sw-spinner { animation: none; border-color: var(--color-online); }
    .sw-panel.fehler .sw-spinner, .sw-panel.fallback .sw-spinner { animation: none; border-color: #fb923c; }
    @keyframes swDreh { to { transform: rotate(360deg); } }
    .sw-panel h1 { margin: 0 0 .6rem; font-size: 1.5rem; letter-spacing: -.02em; }
    .sw-panel p { color: var(--color-text-muted); line-height: 1.55; font-size: .95rem; }
    .sw-site {
      display: inline-block; margin: .8rem 0 .2rem; padding: .5rem .9rem; border-radius: 14px;
      background: rgba(32, 35, 50, .65); border: 1px solid var(--color-border);
      font-family: var(--font-mono); font-size: .85rem; color: var(--color-primary); word-break: break-all;
    }
    .sw-count {
      margin: 1.2rem 0 .4rem; font-size: 3rem; font-weight: 700; letter-spacing: -.04em;
      color: var(--color-primary); font-variant-numeric: tabular-nums; min-height: 1.2em;
    }
    .sw-status { margin-top: .6rem; font-size: .85rem; color: var(--color-text-dimmed); min-height: 1.3em; }
    .sw-btn {
      display: none; width: 100%; margin-top: 1.2rem; padding: .85rem 1rem; border-radius: 999px;
      background: linear-gradient(90deg, #0284c7 0%, #0ea5e9 50%, #06b6d4 100%);
      color: #fff; font-weight: 700; font-size: .95rem; text-decoration: none; text-align: center; border: 0; cursor: pointer;
    }
    .sw-btn.secondary {
      background: transparent; border: 1px solid var(--color-border); color: var(--color-text-muted); font-weight: 600;
    }
    .sw-panel.fehler .sw-btn, .sw-panel.fertig .sw-btn, .sw-panel.fallback .sw-btn { display: block; }
    .sw-confirm { display: none; margin-top: 1rem; text-align: left; padding: .9rem 1rem; border-radius: 14px;
      background: rgba(32, 35, 50, .65); border: 1px solid var(--color-border); }
    .sw-panel.confirm .sw-confirm { display: block; }
    .sw-panel.confirm .sw-btn#swNormal { display: none; }
  </style>
</head>
<body>
  <main class="app-container">
    <header class="app-header">
      <a class="brand" href="/mein">
        <img class="brand-logo" src="/static/cloudy.svg" width="48" height="48" alt="" aria-hidden="true">
        <span class="brand-title">cloudy</span>
      </a>
    </header>

    <section class="panel sw-panel" id="swPanel">
      <div class="sw-spinner" aria-hidden="true"></div>
      <h1 id="swTitel">VPN-Wechsel</h1>
      <p id="swText">Ich verbinde dich übers VPN. Danach geht’s weiter zur Seite.</p>
      {% if host %}<div class="sw-site">{{ host }}</div>{% endif %}
      <div class="sw-count" id="swCount" hidden></div>
      <div class="sw-status" id="swStatus" aria-live="polite"></div>
      <a class="sw-btn" id="swBtn" href="#">Seite öffnen</a>
      <button type="button" class="sw-btn secondary" id="swNormal">Über normales Internet schauen</button>
      <div class="sw-confirm" id="swConfirm">
        <p style="margin:0 0 .8rem">Wirklich ohne VPN über normales Internet öffnen?</p>
        <button type="button" class="sw-btn" id="swConfirmOk" style="display:block">Ja, normales Internet nutzen</button>
        <button type="button" class="sw-btn secondary" id="swConfirmNo" style="display:block;margin-top:.5rem">Abbrechen</button>
      </div>
    </section>
  </main>

  <script>
    (function () {
      var host = {{ host | tojson }};
      var targetUrl = {{ target_url | tojson }};
      var panel = document.getElementById("swPanel");
      var titel = document.getElementById("swTitel");
      var text = document.getElementById("swText");
      var status = document.getElementById("swStatus");
      var countEl = document.getElementById("swCount");
      var btn = document.getElementById("swBtn");
      var normalBtn = document.getElementById("swNormal");
      var ziel = targetUrl || (host ? "https://" + host + "/" : "");
      var start = Date.now();
      var MAX_MS = 120000;
      var COUNTDOWN_S = 5;
      var countdownLauft = false;
      var label = "";

      function zurZielseite() {
        if (!ziel) return;
        try {
          window.location.href = ziel;
        } catch (e) {
          location.replace(ziel);
        }
      }

      btn.addEventListener("click", function (e) {
        if (ziel) {
          e.preventDefault();
          zurZielseite();
        }
      });

      function ende(art, t, msg, showNormal) {
        panel.className = "panel sw-panel " + art;
        titel.textContent = t;
        text.textContent = msg;
        status.textContent = "";
        countEl.hidden = true;
        if (ziel) {
          btn.href = ziel;
          btn.textContent = "Seite öffnen";
          btn.style.display = "block";
        } else {
          btn.style.display = "none";
        }
        normalBtn.style.display = showNormal ? "block" : "none";
      }

      if (!host && !ziel) { return ende("fehler", "Gesperrt", "Diese Seite ist gesperrt.", false); }

      // Exakt 5 Sekunden Countdown, dann zur richtigen Seite – immer, auch wenn VPN schon an war.
      function starteCountdown() {
        if (countdownLauft) return;
        countdownLauft = true;
        panel.classList.add("fertig");
        titel.textContent = "Verbunden";
        text.textContent = "Gleich geht’s weiter zu " + (host || "deiner Seite") + ".";
        countEl.hidden = false;
        if (ziel) {
          btn.href = ziel;
          btn.textContent = "Jetzt zur Seite";
          btn.style.display = "block";
        }
        var endeAt = Date.now() + COUNTDOWN_S * 1000;

        function tick() {
          var rest = Math.max(0, Math.ceil((endeAt - Date.now()) / 1000));
          countEl.textContent = String(rest);
          status.textContent = label ? label : "";
          if (rest > 0) {
            setTimeout(tick, 200);
            return;
          }
          status.textContent = "Weiterleitung …";
          zurZielseite();
        }
        tick();
      }

      normalBtn.addEventListener("click", function () { panel.classList.add("confirm"); });
      document.getElementById("swConfirmNo").addEventListener("click", function () {
        panel.classList.remove("confirm");
      });
      document.getElementById("swConfirmOk").addEventListener("click", function () {
        status.textContent = "Schalte auf normales Internet …";
        var body = new FormData();
        body.append("host", host);
        fetch("/vpn-wechsel/normal", { method: "POST", body: body, cache: "no-store" })
          .then(function (r) { return r.json(); })
          .then(function (s) {
            if (s.state === "ready") {
              label = s.label || "Normales Internet";
              starteCountdown();
            } else {
              ende("fehler", "Nicht möglich", "Normales Internet konnte nicht freigeschaltet werden.", true);
            }
          })
          .catch(function () {
            ende("fehler", "Nicht möglich", "cloudy hat nicht geantwortet.", true);
          });
      });

      function schritt() {
        if (countdownLauft) return;
        if (Date.now() - start > MAX_MS) {
          return ende("fallback", "Kein VPN-Profil gefunden",
            "Kein verbundenes VPN-Profil konnte diese Seite erreichen.", true);
        }
        fetch("/vpn-wechsel/status?host=" + encodeURIComponent(host), { cache: "no-store" })
          .then(function (r) { return r.json(); })
          .then(function (s) {
            if (countdownLauft) return;
            if (s.state === "none") {
              return ende("fehler", "Gesperrt", "Diese Seite ist gesperrt.", false);
            }
            if (s.state === "blocked") {
              return ende("fehler", "Wechsel nicht möglich",
                "Dein Gerät darf für diese Seite nicht aufs VPN wechseln.", false);
            }
            if (s.state === "none_found") {
              return ende("fallback", "Kein VPN-Profil gefunden",
                "Kein verbundenes VPN-Profil konnte diese Seite erreichen.", true);
            }
            if (s.state === "ready") {
              label = s.normal ? "Normales Internet" : ("Über " + (s.label || "VPN"));
              starteCountdown();
              return;
            }
            status.textContent = s.state === "probing"
              ? "Prüfe VPN-Profile …"
              : ("Wechsle aufs VPN" + (s.label ? " (" + s.label + ")" : "") + " …");
            setTimeout(schritt, 1200);
          })
          .catch(function () {
            status.textContent = "Warte auf cloudy …";
            setTimeout(schritt, 2500);
          });
      }
      schritt();
    })();
  </script>
</body>
</html>
