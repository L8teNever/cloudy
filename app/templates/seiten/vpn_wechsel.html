<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex">
  <title>cloudy – VPN-Wechsel</title>
  {% include "teile/icons.html" %}
  {% include "teile/mein_stil.html" %}
  <style>
    .sw-panel { padding: 2rem 1.5rem 1.5rem; text-align: center; }
    .sw-spinner {
      width: 46px; height: 46px; margin: 0 auto 1.1rem; border-radius: 50%;
      border: 4px solid rgba(125, 211, 252, .18); border-top-color: var(--color-primary);
      animation: swDreh 0.9s linear infinite;
    }
    .sw-panel.fertig .sw-spinner, .sw-panel.fehler .sw-spinner { animation: none; border-color: var(--color-online); }
    .sw-panel.fehler .sw-spinner { border-color: #fb923c; }
    @keyframes swDreh { to { transform: rotate(360deg); } }
    .sw-panel h1 { margin: 0 0 .6rem; font-size: 1.5rem; letter-spacing: -.02em; }
    .sw-panel p { color: var(--color-text-muted); line-height: 1.55; font-size: .95rem; }
    .sw-site {
      display: inline-block; margin: .8rem 0 .2rem; padding: .5rem .9rem; border-radius: 14px;
      background: rgba(32, 35, 50, .65); border: 1px solid var(--color-border);
      font-family: var(--font-mono); font-size: .85rem; color: var(--color-primary); word-break: break-all;
    }
    .sw-status { margin-top: 1rem; font-size: .85rem; color: var(--color-text-dimmed); min-height: 1.3em; }
    .sw-btn {
      display: none; width: 100%; margin-top: 1.2rem; padding: .85rem 1rem; border-radius: 999px;
      background: linear-gradient(90deg, #0284c7 0%, #0ea5e9 50%, #06b6d4 100%);
      color: #fff; font-weight: 700; font-size: .95rem; text-decoration: none; text-align: center;
    }
    .sw-panel.fehler .sw-btn, .sw-panel.fertig .sw-btn { display: block; }
  </style>
</head>
<body>
  <main class="app-container">
    <header class="app-header">
      <a class="brand" href="/mein">
        <img class="brand-logo" src="/static/cloudy.svg" width="48" height="48" alt="" aria-hidden="true">
        <span class="brand-title">cloudy</span>
      </a>
    </header>

    <section class="panel sw-panel" id="swPanel">
      <div class="sw-spinner" aria-hidden="true"></div>
      <h1 id="swTitel">Einen Moment …</h1>
      <p id="swText">Diese Seite braucht ein VPN. Ich verbinde dich und leite dich gleich weiter.</p>
      {% if host %}<div class="sw-site">{{ host }}</div>{% endif %}
      <div class="sw-status" id="swStatus" aria-live="polite"></div>
      <a class="sw-btn" id="swBtn" href="#">Seite öffnen</a>
    </section>
  </main>

  <script>
    (function () {
      var host = {{ host | tojson }};
      var panel = document.getElementById("swPanel");
      var titel = document.getElementById("swTitel");
      var text = document.getElementById("swText");
      var status = document.getElementById("swStatus");
      var btn = document.getElementById("swBtn");
      var ziel = host ? "https://" + host + "/" : "";
      var start = Date.now();
      var MAX_MS = 90000;

      function ende(art, t, msg) {
        panel.classList.add(art);
        titel.textContent = t;
        text.textContent = msg;
        status.textContent = "";
        if (ziel) { btn.href = ziel; }
        else { btn.style.display = "none"; }
      }

      // Schutz vor Endlosschleife: Wird die Seite trotz Wechsel wieder gesperrt, landet man erneut hier.
      var key = "cloudyVpnWechsel:" + host, jetzt = Date.now(), liste = [];
      try { liste = JSON.parse(sessionStorage.getItem(key) || "[]").filter(function (t) { return jetzt - t < 120000; }); } catch (e) {}
      liste.push(jetzt);
      try { sessionStorage.setItem(key, JSON.stringify(liste)); } catch (e) {}
      if (!host) { return ende("fehler", "Gesperrt", "Diese Seite ist gesperrt."); }
      if (liste.length > 4) {
        return ende("fehler", "Das klappt gerade nicht",
          "Die Seite ist trotz VPN noch gesperrt. Meist hilft es, „Sicheres DNS“ im Browser auszuschalten und es erneut zu versuchen.");
      }

      function erreichbar() {
        // Nur ob die Verbindung klappt (Antwort selbst ist egal): schlägt fehl, solange die alte Sperre noch im Cache ist.
        var ctl = typeof AbortController === "function" ? new AbortController() : null;
        var timer = ctl ? setTimeout(function () { ctl.abort(); }, 5000) : null;
        return fetch(ziel, { mode: "no-cors", cache: "no-store", signal: ctl ? ctl.signal : undefined })
          .then(function () { clearTimeout(timer); return true; })
          .catch(function () { clearTimeout(timer); return false; });
      }

      function schritt() {
        if (Date.now() - start > MAX_MS) {
          return ende("fehler", "Das dauert zu lange",
            "Der Wechsel aufs VPN hat nicht geklappt. Versuch es gleich noch einmal oder melde dich bei Simon.");
        }
        fetch("/vpn-wechsel/status?host=" + encodeURIComponent(host), { cache: "no-store" })
          .then(function (r) { return r.json(); })
          .then(function (s) {
            if (s.state === "none") {
              return ende("fehler", "Gesperrt", "Diese Seite ist gesperrt. Wenn das ein Fehler ist, melde dich bei Simon.");
            }
            if (s.state === "blocked") {
              return ende("fehler", "Wechsel nicht möglich",
                "Dein Gerät darf für diese Seite nicht aufs VPN wechseln. Melde dich bei Simon.");
            }
            if (s.state === "ready") {
              status.textContent = "Verbunden" + (s.label ? " über " + s.label : "") + " – ich prüfe die Seite …";
              return erreichbar().then(function (ok) {
                if (ok) {
                  titel.textContent = "Weiter geht’s";
                  status.textContent = "Du wirst weitergeleitet …";
                  location.replace(ziel);
                } else {
                  setTimeout(schritt, 2500);
                }
              });
            }
            status.textContent = "Wechsle aufs VPN" + (s.label ? " (" + s.label + ")" : "") + " …";
            setTimeout(schritt, 1500);
          })
          .catch(function () { status.textContent = "Warte auf cloudy …"; setTimeout(schritt, 3000); });
      }
      schritt();
    })();
  </script>
</body>
</html>
