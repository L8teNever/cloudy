{# Dünner Ladebalken oben + sanftes Einblenden. Am Ende von <body> einbinden (nach anderen Skripten).
   API: Ladebalken.start() / Ladebalken.done(). Normale Links und Formulare starten ihn automatisch. #}
<style>
#ladebalken { position: fixed; top: 0; left: 0; right: 0; height: 3px; z-index: 10000; pointer-events: none; opacity: 0; transition: opacity .25s ease .1s; }
#ladebalken.an { opacity: 1; transition-delay: 0s; }
#ladebalken i { position: absolute; inset: 0; transform-origin: 0 50%; transform: scaleX(0); background: linear-gradient(90deg, #0ea5e9, #38bdf8 60%, #67e8f9); box-shadow: 0 0 10px rgba(56, 189, 248, .7); transition: transform .3s ease; will-change: transform; }
#ladebalken.an i { animation: lbLauf 12s cubic-bezier(.1, .7, .2, 1) forwards; }
#ladebalken.fertig i { animation: none; transform: scaleX(1); transition: transform .2s ease; }
@keyframes lbLauf { 0% { transform: scaleX(0); } 8% { transform: scaleX(.35); } 30% { transform: scaleX(.65); } 100% { transform: scaleX(.94); } }
@keyframes lbEin { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
.lb-ein { animation: lbEin .28s cubic-bezier(.16, 1, .3, 1) backwards; }
.lb-wartet { opacity: .55; transition: opacity .2s ease .15s; pointer-events: none; }
@keyframes lbDreh { to { transform: rotate(360deg); } }
.lb-spinner { display: inline-block; width: .9em; height: .9em; border: 2px solid currentColor; border-right-color: transparent; border-radius: 50%; animation: lbDreh .7s linear infinite; vertical-align: -.12em; margin-right: .4em; }
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; scroll-behavior: auto !important; }
}
</style>
<div id="ladebalken" aria-hidden="true"><i></i></div>
<script>
(function () {
  var el = document.getElementById("ladebalken"), offen = 0, sicher;
  function start() {
    offen++;
    clearTimeout(sicher);
    el.classList.remove("fertig");
    if (!el.classList.contains("an")) { void el.offsetWidth; el.classList.add("an"); }
    sicher = setTimeout(function () { offen = 0; done(); }, 15000); // z. B. bei Datei-Downloads
  }
  function done() {
    offen = Math.max(0, offen - 1);
    if (offen) return;
    clearTimeout(sicher);
    if (!el.classList.contains("an")) return;
    el.classList.add("fertig");
    setTimeout(function () { el.classList.remove("an"); }, 200);
    setTimeout(function () { if (!offen) el.classList.remove("fertig"); }, 500);
  }
  window.Ladebalken = { start: start, done: done };

  // Normale Seitenwechsel (alles, was nicht schon per JS nachgeladen wird).
  document.addEventListener("click", function (e) {
    if (e.defaultPrevented || e.button !== 0 || e.ctrlKey || e.metaKey || e.shiftKey || e.altKey) return;
    var a = e.target.closest && e.target.closest("a[href]");
    if (!a || a.target || a.hasAttribute("download") || a.hasAttribute("data-nav")) return;
    var url;
    try { url = new URL(a.href, location.href); } catch (_) { return; }
    if (url.origin !== location.origin || /\.(crt|mobileconfig|bat|png|svg|txt)$/i.test(url.pathname)) return;
    if (url.pathname === location.pathname && url.search === location.search && url.hash) return;
    start();
  });
  document.addEventListener("submit", function (e) {
    if (!e.defaultPrevented) start();
  });
  // Zurück-Taste (Seite aus dem Cache): Balken und Sperren zurücksetzen.
  window.addEventListener("pageshow", function (e) {
    if (!e.persisted) return;
    if (document.querySelector(".switch.busy")) { location.reload(); return; } // Schalter wurde schon umgeklappt
    offen = 0; el.classList.remove("an", "fertig");
    if (window.CloudyLoader) { CloudyLoader.hide(); document.querySelectorAll("button.loading").forEach(CloudyLoader.buttonReset); }
    document.querySelectorAll(".lb-wartet").forEach(function (n) { n.classList.remove("lb-wartet"); });
  });
})();
</script>
