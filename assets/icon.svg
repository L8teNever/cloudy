<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 200" width="100%" height="100%">
  <defs>
    <!-- Sanfter Babyblau-Wolkenverlauf (Weiß oben zu Sky-Blue unten) -->
    <linearGradient id="cloudGrad" x1="170" y1="40" x2="170" y2="170" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="40%" stop-color="#f0f9ff"/>
      <stop offset="75%" stop-color="#bae6fd"/>
      <stop offset="100%" stop-color="#7dd3fc"/>
    </linearGradient>

    <!-- Linker Flügel / Arm Verlauf -->
    <linearGradient id="leftWingGrad" x1="100%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>

    <!-- Rechter Flügel / Arm Verlauf -->
    <linearGradient id="rightWingGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>

    <!-- Ohren Verläufe -->
    <linearGradient id="earLeft" x1="100%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#7dd3fc"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>

    <linearGradient id="earRight" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7dd3fc"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>

    <!-- Pupillen Verlauf (Tiefes Nachtblau) -->
    <linearGradient id="pupilDark" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#071b30"/>
      <stop offset="100%" stop-color="#0f2b48"/>
    </linearGradient>
  </defs>

  <!-- LINKER FLÜGEL / ARM (Fröhlich nach links-oben gewinkelt) -->
  <path d="M 85 130 C 65 125, 38 112, 30 96 C 24 84, 38 78, 48 85 C 60 94, 76 108, 88 118 Z" 
        fill="url(#leftWingGrad)"/>

  <!-- RECHTER FLÜGEL / ARM (Symmetrisch nach rechts-oben gewinkelt) -->
  <path d="M 255 130 C 275 125, 302 112, 310 96 C 316 84, 302 78, 292 85 C 280 94, 264 108, 252 118 Z" 
        fill="url(#rightWingGrad)"/>

  <!-- LINKES FEDEROHR -->
  <path d="M 125 68 C 118 46, 106 28, 98 18 C 106 18, 118 30, 128 44 C 134 52, 138 58, 140 68 Z" 
        fill="url(#earLeft)"/>

  <!-- RECHTES FEDEROHR -->
  <path d="M 215 68 C 222 46, 234 28, 242 18 C 234 18, 222 30, 212 44 C 206 52, 202 58, 200 68 Z" 
        fill="url(#earRight)"/>

  <!-- FLUFFIGER WOLKENKÖRPER -->
  <path d="
    M 80 140
    C 65 122, 75 98, 102 90
    C 108 72, 130 52, 170 52
    C 210 52, 232 72, 238 90
    C 265 98, 275 122, 260 140
    C 272 152, 260 166, 240 166
    C 220 168, 200 164, 170 164
    C 140 164, 120 168, 100 166
    C 80 166, 68 152, 80 140 Z"
    fill="url(#cloudGrad)"/>

  <!-- WANGEN (Süßes Babyblau-Blush) -->
  <ellipse cx="116" cy="132" rx="12" ry="7" fill="#38bdf8" opacity="0.6"/>
  <ellipse cx="224" cy="132" rx="12" ry="7" fill="#38bdf8" opacity="0.6"/>

  <!-- AUGEN (Äußeres Weiß) -->
  <ellipse cx="140" cy="116" rx="23" ry="24" fill="#ffffff"/>
  <ellipse cx="200" cy="116" rx="23" ry="24" fill="#ffffff"/>

  <!-- PUPILLEN (Nachtblau) -->
  <circle cx="143" cy="116" r="16" fill="url(#pupilDark)"/>
  <circle cx="197" cy="116" r="16" fill="url(#pupilDark)"/>

  <!-- LICHTREFLEXE / GLANZPUNKTE -->
  <!-- Linkes Auge -->
  <circle cx="148" cy="110" r="6.5" fill="#ffffff"/>
  <circle cx="137" cy="122" r="3" fill="#ffffff"/>

  <!-- Rechtes Auge -->
  <circle cx="202" cy="110" r="6.5" fill="#ffffff"/>
  <circle cx="191" cy="122" r="3" fill="#ffffff"/>

  <!-- ORANGEFARBENER SCHNABEL -->
  <path d="M 166 122 Q 170 122 174 122 L 170 137 Z" 
        fill="#f59e0b" 
        stroke="#f59e0b" 
        stroke-width="1.5" 
        stroke-linejoin="round"/>
</svg>