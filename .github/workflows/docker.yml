name: Docker-Image bauen

on:
  push:
    branches: [main, master]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

jobs:
  # Läuft parallel zum Build – blockiert den Image-Push nicht.
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Tests
        run: |
          pip install -q -r requirements.txt pytest httpx
          python -m pytest -q --tb=line

  # Pro Image + Architektur ein nativer Runner (kein QEMU → deutlich schneller).
  build:
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - { context: ".",  tag: latest, scope: buildkit, platform: linux/amd64, runner: ubuntu-latest }
          - { context: ".",  tag: latest, scope: buildkit, platform: linux/arm64, runner: ubuntu-24.04-arm }
          - { context: vpn,  tag: vpn,    scope: vpn,      platform: linux/amd64, runner: ubuntu-latest }
          - { context: vpn,  tag: vpn,    scope: vpn,      platform: linux/arm64, runner: ubuntu-24.04-arm }
          - { context: warp, tag: warp,   scope: warp,     platform: linux/amd64, runner: ubuntu-latest }
          - { context: warp, tag: warp,   scope: warp,     platform: linux/arm64, runner: ubuntu-24.04-arm }
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Platform-Paar
        id: prep
        run: |
          platform=${{ matrix.platform }}
          echo "pair=${platform//\//-}" >> "$GITHUB_OUTPUT"
          # ghcr verlangt kleingeschriebene Repo-Namen (L8teNever → l8tenever)
          echo "IMAGE_NAME=${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - id: build
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          platforms: ${{ matrix.platform }}
          outputs: type=image,name=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ matrix.scope }}-${{ steps.prep.outputs.pair }}
          cache-to: type=gha,scope=${{ matrix.scope }}-${{ steps.prep.outputs.pair }},mode=max

      - name: Digest ablegen
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - uses: actions/upload-artifact@v4
        with:
          name: digests-${{ matrix.tag }}-${{ steps.prep.outputs.pair }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  # Digests zu Multi-Arch-Tags zusammenführen (latest / vpn / warp).
  merge:
    needs: [build]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - { tag: latest, sha_prefix: "sha-" }
          - { tag: vpn,    sha_prefix: "vpn-" }
          - { tag: warp,   sha_prefix: "warp-" }
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: digests-${{ matrix.tag }}-*
          path: /tmp/digests
          merge-multiple: true

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Manifest erstellen
        working-directory: /tmp/digests
        run: |
          image="${REGISTRY}/${GITHUB_REPOSITORY,,}"
          short="${GITHUB_SHA:0:7}"
          docker buildx imagetools create \
            -t "${image}:${{ matrix.tag }}" \
            -t "${image}:${{ matrix.sha_prefix }}${short}" \
            $(printf "${image}@sha256:%s " *)
