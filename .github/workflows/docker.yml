name: Docker-Image bauen

on:
  push:
    branches: [main, master]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Tests
        run: |
          pip install -r requirements.txt pytest httpx
          python -m pytest -q



  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: cloudy-test
          cache-from: type=gha,scope=buildkit

      - name: dnsmasq-Konfiguration prüfen (DNS und DHCP)
        run: |
          docker run --rm cloudy-test sh -c 'python -m app.dnsmasq > /tmp/d.conf && dnsmasq --test --conf-file=/tmp/d.conf'
          docker run --rm -e DHCP_ENABLED=1 cloudy-test sh -c 'python -m app.dnsmasq > /tmp/d.conf && dnsmasq --test --conf-file=/tmp/d.conf'
          # IPv6 über den Pi: Router Advertisement mit eigenem ULA-Netz muss von dnsmasq akzeptiert werden
          docker run --rm -e DHCP_ENABLED=1 -e GATEWAY_ENABLED=1 -e IPV6_ENABLED=1 -e IPV6_PREFIX=fd12:3456:789a:1::/64 cloudy-test sh -c 'python -m app.dnsmasq > /tmp/d.conf && grep -q enable-ra /tmp/d.conf && ! grep -q filter-AAAA /tmp/d.conf && dnsmasq --test --conf-file=/tmp/d.conf'

      - name: End-to-End – DNS-Anfrage erscheint im Dashboard
        run: |
          docker network create cloudy-net
          docker run -d --name cloudy --network cloudy-net -e LAN_INTERFACE=eth0 -e UPSTREAM_DNS=1.1.1.1 cloudy-test
          sleep 8
          IP=$(docker inspect -f '{{range .NetworkSettings.Networks}}{{.IPAddress}}{{end}}' cloudy)
          docker run --rm --network cloudy-net busybox nslookup example.com "$IP"
          docker run --rm --network cloudy-net busybox nslookup cloudy.lan "$IP" | tee /tmp/name.txt
          grep -q "192.168.178.2" /tmp/name.txt
          sleep 8
          docker exec cloudy python -c "import urllib.request; print(urllib.request.urlopen('http://127.0.0.1:8080/api/recent').read().decode())" | tee /tmp/recent.json
          grep -q '"example.com"' /tmp/recent.json
          # HTTPS mit dem selbst erzeugten Zertifikat (Name cloudy.lan wird gegen die lokale CA geprüft)
          docker exec cloudy python -c "
          import socket, ssl
          ctx = ssl.create_default_context(cafile='/data/certs/cloudy-ca.crt')
          s = ctx.wrap_socket(socket.create_connection(('127.0.0.1', 443)), server_hostname='cloudy.lan')
          s.sendall(b'GET /healthz HTTP/1.1\r\nHost: cloudy.lan\r\nConnection: close\r\n\r\n')
          data = s.recv(4096)
          assert b'200 OK' in data, data
          print('HTTPS ok')
          "

      - name: End-to-End – Domain-Weiterleitung (DNS inkl. Subdomains, kein IPv6, HTTP + HTTPS)
        run: |
          IP=$(docker inspect -f '{{range .NetworkSettings.Networks}}{{.IPAddress}}{{end}}' cloudy)
          # Regel über das Dashboard anlegen (wie im Browser), danach startet dnsmasq neu.
          docker exec cloudy python -c "
          import urllib.request, urllib.parse
          data = urllib.parse.urlencode({'source': 'https://www.TikTok.com/foo', 'target': 'wikipedia.org'}).encode()
          urllib.request.urlopen('http://127.0.0.1:8080/redirects/add', data)
          "
          sleep 2
          for name in tiktok.com www.tiktok.com m.tiktok.com; do
            docker run --rm --network cloudy-net busybox nslookup "$name" "$IP" | tee /tmp/r.txt
            grep -q "192.168.178.2" /tmp/r.txt
          done
          # Keine echte IPv6-Adresse der Seite (sonst ginge der Browser per IPv6 direkt hin)
          docker run --rm --network cloudy-net busybox nslookup -type=AAAA tiktok.com "$IP" | tee /tmp/r6.txt || true
          if grep -E "^Address: .*:" /tmp/r6.txt; then echo "FEHLER: AAAA-Antwort für Weiterleitung"; exit 1; fi
          # dnsmasq lief beim Neustart weiter, der Container wurde nicht neu gestartet
          test "$(docker inspect -f '{{.RestartCount}}' cloudy)" = "0"
          test "$(docker inspect -f '{{.State.Running}}' cloudy)" = "true"
          # HTTP und HTTPS (mit Zertifikat für *.tiktok.com, geprüft gegen die cloudy-CA) leiten weiter
          docker exec cloudy python -c "
          import socket, ssl, http.client
          c = http.client.HTTPConnection('127.0.0.1', 8080); c.request('GET', '/', headers={'Host': 'm.tiktok.com'})
          r = c.getresponse(); assert r.status == 302 and r.getheader('location') == 'https://wikipedia.org', r.status
          ctx = ssl.create_default_context(cafile='/data/certs/cloudy-ca.crt')
          s = ctx.wrap_socket(socket.create_connection(('127.0.0.1', 443)), server_hostname='www.tiktok.com')
          s.sendall(b'GET / HTTP/1.1\r\nHost: www.tiktok.com\r\nConnection: close\r\n\r\n')
          data = s.recv(4096)
          assert b'302' in data and b'https://wikipedia.org' in data, data
          print('Weiterleitung HTTP + HTTPS ok')
          "

      - name: End-to-End – Gateway leitet weiter und misst den Datenverkehr
        run: |
          docker network create --subnet 172.30.0.0/24 --gateway 172.30.0.1 gw-net
          docker run -d --name cloudy-gw --network gw-net --ip 172.30.0.2 --privileged \
            -e LAN_INTERFACE=eth0 -e PI_IP=172.30.0.2 -e ROUTER_IP=172.30.0.1 -e UPSTREAM_DNS=1.1.1.1 \
            -e GATEWAY_ENABLED=1 -e TRAFFIC_POLL_SECONDS=2 cloudy-test
          sleep 8
          docker run --rm --network gw-net --ip 172.30.0.10 --cap-add NET_ADMIN alpine sh -c \
            'echo "nameserver 172.30.0.2" > /etc/resolv.conf && ip route replace default via 172.30.0.2 && wget -q -O /dev/null https://example.com && echo "Download über den Gateway ok"'
          sleep 6
          docker exec cloudy-gw python -c "import urllib.request; print(urllib.request.urlopen('http://127.0.0.1:8080/api/devices/172.30.0.10').read().decode())" | tee /tmp/dev.json
          python3 -c "import json; d=json.load(open('/tmp/dev.json')); t=[x for x in d['traffic'] if x['target']=='example.com']; assert t and t[0]['bytes_down'] > 0, d; print('Gemessen:', t)"

      - name: End-to-End – zugeordnetes Gerät läuft durch den WARP-Container, ohne Tunnel über die Fritzbox
        run: |
          # Nachgebauter WARP-Container: leitet weiter und zählt die Pakete des Geräts.
          docker network create --subnet 172.29.86.0/24 warp-test
          docker run -d --name fake-warp --network warp-test --ip 172.29.86.11 --cap-add NET_ADMIN             --sysctl net.ipv4.ip_forward=1 --sysctl net.ipv4.conf.all.send_redirects=0 alpine sh -c             'apk add -q iptables && ip route add 172.30.0.0/24 via 172.29.86.2 &&
             iptables -A FORWARD -s 172.30.0.11 -j ACCEPT && iptables -t nat -A POSTROUTING -o eth0 -j MASQUERADE &&
             touch /tmp/bereit && sleep infinity'
          docker run -d --name cloudy-wr --network gw-net --ip 172.30.0.3 --privileged             -e LAN_INTERFACE=eth0 -e PI_IP=172.30.0.3 -e ROUTER_IP=172.30.0.1 -e UPSTREAM_DNS=1.1.1.1             -e GATEWAY_ENABLED=1 -e WARP_SLOTS=warp1=172.29.86.11 cloudy-test
          docker network connect --ip 172.29.86.2 warp-test cloudy-wr
          docker run -d --name geraet --network gw-net --ip 172.30.0.11 --mac-address 02:42:ac:1e:00:11             --cap-add NET_ADMIN alpine sh -c             'echo "nameserver 172.30.0.3" > /etc/resolv.conf && ip route replace default via 172.30.0.3 && sleep infinity'
          sleep 8
          docker exec fake-warp test -f /tmp/bereit
          api() { docker exec cloudy-wr python -c "import sys, urllib.request; urllib.request.urlopen('http://127.0.0.1:8080' + sys.argv[1], data=sys.argv[2].encode())" "$@"; }
          zaehler() { docker exec fake-warp iptables -L FORWARD -v -n -x | grep 172.30.0.11 | awk '{print $1}'; }
          tunnel() { docker exec cloudy-wr sh -c "mkdir -p /data/warp/warp1 && echo $1 > /data/warp/warp1/status"; }

          api /devices/warp "mac=02:42:ac:1e:00:11&slot=warp1"
          tunnel Connected
          sleep 7
          docker exec geraet wget -q -O /dev/null https://example.com
          echo "Pakete durch WARP: $(zaehler)"
          test "$(zaehler)" -gt 0

          # Tunnel weg -> Gerät geht über die Fritzbox und hat weiter Internet.
          tunnel Disconnected
          sleep 7
          docker exec fake-warp iptables -Z FORWARD
          docker exec geraet wget -q -O /dev/null https://example.com
          echo "Pakete durch WARP ohne Tunnel: $(zaehler)"
          test "$(zaehler)" -eq 0

          # Zuordnung aufheben -> wieder normal, auch bei verbundenem Tunnel.
          tunnel Connected
          api /devices/warp "mac=02:42:ac:1e:00:11&slot="
          sleep 7
          docker exec fake-warp iptables -Z FORWARD
          docker exec geraet wget -q -O /dev/null https://example.com
          test "$(zaehler)" -eq 0
          # Standard für alle Geräte: ohne eigene Zuordnung läuft das Gerät durch WARP ...
          api /warp/default "slot=warp1"
          sleep 7
          docker exec fake-warp iptables -Z FORWARD
          docker exec geraet wget -q -O /dev/null https://example.com
          echo "Pakete durch WARP (Standard): $(zaehler)"
          test "$(zaehler)" -gt 0
          # ... außer es ist ausdrücklich auf "normal" gestellt.
          api /devices/warp "mac=02:42:ac:1e:00:11&slot=direct"
          sleep 7
          docker exec fake-warp iptables -Z FORWARD
          docker exec geraet wget -q -O /dev/null https://example.com
          test "$(zaehler)" -eq 0
          api /devices/warp "mac=02:42:ac:1e:00:11&slot="
          api /warp/default "slot="
          sleep 7
          echo "WARP-Routing ok"

          # Online-Anzeige: das laufende "Gerät" erscheint als online, nach dem Stoppen als offline.
          online() { docker exec cloudy-wr python -c "import json, urllib.request; d = json.load(urllib.request.urlopen('http://127.0.0.1:8080/api/devices')); print([x['online'] for x in d if x['ip'] == '172.30.0.11'][0])"; }
          sleep 35
          test "$(online)" = "True"
          docker stop geraet
          sleep 40
          test "$(online)" = "False"
          echo "Online-Anzeige ok"

      - name: Logs bei Fehler
        if: failure()
        run: |
          docker logs cloudy || true
          docker logs cloudy-gw || true
          docker logs cloudy-wr || true


  dhcp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: cloudy-test
          cache-from: type=gha,scope=buildkit

      - name: End-to-End – DHCP vergibt nach Update/Neustart dieselben Adressen
        run: |
          docker network create --subnet 172.31.0.0/24 --gateway 172.31.0.1 dhcp-net
          start_server() {
            docker run -d --name cloudy-dhcp --network dhcp-net --ip 172.31.0.2 --privileged -v dhcp-data:/data \
              -e LAN_INTERFACE=eth0 -e PI_IP=172.31.0.2 -e ROUTER_IP=172.31.0.1 -e UPSTREAM_DNS=1.1.1.1 \
              -e DHCP_ENABLED=1 -e DHCP_START=172.31.0.100 -e DHCP_END=172.31.0.150 cloudy-test
            sleep 8
          }
          get_ip() {  # $1 = MAC-Adresse des "Geräts"
            docker run --rm --network dhcp-net --cap-add NET_ADMIN --mac-address "$1" alpine \
              sh -c 'udhcpc -i eth0 -n -q -t 5 -T 2 -s /bin/true 2>&1' | grep -oE 'lease of [0-9.]+' | grep -oE '[0-9.]+$'
          }
          start_server
          A1=$(get_ip 02:42:ac:1f:00:a1); B1=$(get_ip 02:42:ac:1f:00:b2); C1=$(get_ip 02:42:ac:1f:00:c3)
          echo "Vorher:  a=$A1 b=$B1 c=$C1"
          test -n "$A1" && test -n "$B1" && test -n "$C1"
          test "$A1" != "$B1" && test "$B1" != "$C1"

          # Update: Container wird ersetzt, die Daten (Volume) bleiben.
          docker rm -f cloudy-dhcp
          start_server
          A2=$(get_ip 02:42:ac:1f:00:a1); B2=$(get_ip 02:42:ac:1f:00:b2); C2=$(get_ip 02:42:ac:1f:00:c3)
          echo "Nachher: a=$A2 b=$B2 c=$C2"
          test "$A1" = "$A2" && test "$B1" = "$B2" && test "$C1" = "$C2"

          # Auch wenn die Lease-Datei verloren geht, bekommen bekannte Geräte dieselbe Adresse zurück
          # (dnsmasq berechnet sie aus der MAC-Adresse).
          docker rm -f cloudy-dhcp
          docker volume rm dhcp-data
          start_server
          A3=$(get_ip 02:42:ac:1f:00:a1)
          echo "Ohne Lease-Datei: a=$A3"
          test "$A1" = "$A3"

      - name: Logs bei Fehler
        if: failure()
        run: |
          docker logs cloudy-dhcp || true


  warp-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/build-push-action@v6
        with:
          context: warp
          load: true
          tags: cloudy-warp-test
          cache-from: type=gha,scope=warp

      - name: WARP-Image – Dienst startet und lehnt einen falschen Token ab
        run: |
          docker run --rm cloudy-warp-test warp-cli --version
          mkdir -p /tmp/warp && echo ungueltiger-token > /tmp/warp/token
          docker run -d --name warp-echt --cap-add NET_ADMIN --device /dev/net/tun             --sysctl net.ipv4.ip_forward=1 -v /tmp/warp:/cloudy cloudy-warp-test
          for i in $(seq 1 30); do
            s="$(sudo cat /tmp/warp/status 2>/dev/null || true)"
            echo "Status: $s"
            case "$s" in "Fehler: Anmeldung abgelehnt"*) echo "WARP-Image ok"; exit 0 ;; esac
            sleep 3
          done
          exit 1

      - name: Logs bei Fehler
        if: failure()
        run: |
          docker logs warp-echt || true


  vpn-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/build-push-action@v6
        with:
          context: vpn
          load: true
          tags: cloudy-vpn-test
          cache-from: type=gha,scope=vpn

      - name: VPN-Image – WireGuard-Tunnel baut sich auf und leitet Geräte durch
        run: |
          bash -n vpn/entrypoint.sh
          docker network create --subnet 172.40.0.0/24 vpn-net
          key() { docker run --rm cloudy-vpn-test wg genkey; }
          pub() { echo "$1" | docker run --rm -i cloudy-vpn-test wg pubkey; }
          SK=$(key); SP=$(pub "$SK"); CK=$(key); CP=$(pub "$CK")
          # Gegenstelle (wie der Proton-Server)
          docker run -d --name wg-server --network vpn-net --ip 172.40.0.2 --cap-add NET_ADMIN --device /dev/net/tun \
            --sysctl net.ipv4.ip_forward=1 --entrypoint sh cloudy-vpn-test -c \
            "printf '[Interface]\nPrivateKey = $SK\nAddress = 10.99.0.1/24\nListenPort = 51820\n[Peer]\nPublicKey = $CP\nAllowedIPs = 10.99.0.2/32\n' > /etc/wireguard/wgs.conf && wg-quick up wgs && sleep infinity"
          # Konfiguration so, wie Proton sie liefert (mit DNS und Windows-Zeilenenden)
          mkdir -p /tmp/vpn
          printf '[Interface]\r\nPrivateKey = %s\r\nAddress = 10.99.0.2/32\r\nDNS = 10.2.0.1\r\n\r\n[Peer]\r\nPublicKey = %s\r\nAllowedIPs = 0.0.0.0/0\r\nEndpoint = 172.40.0.2:51820\r\n' "$CK" "$SP" > /tmp/vpn/wg.conf
          docker run -d --name vpn-client --network vpn-net --ip 172.40.0.3 --cap-add NET_ADMIN --device /dev/net/tun \
            --sysctl net.ipv4.ip_forward=1 -v /tmp/vpn:/cloudy cloudy-vpn-test
          for i in $(seq 1 30); do
            s="$(sudo cat /tmp/vpn/status 2>/dev/null || true)"; echo "Status: $s"
            [ "$s" = "Connected" ] && break
            sleep 2
          done
          test "$s" = "Connected"
          # Ein "Gerät" schickt Pakete über den VPN-Container, sie kommen durch den Tunnel beim Server an.
          docker run --rm --network vpn-net --ip 172.40.0.10 --cap-add NET_ADMIN alpine sh -c \
            'ip route add 10.99.0.1 via 172.40.0.3 && ping -c 3 -W 3 10.99.0.1'
          # Kill-Switch: Ohne Tunnel kein Weiterleiten am Tunnel vorbei.
          docker exec vpn-client ip link del wg0
          ! docker run --rm --network vpn-net --ip 172.40.0.11 --cap-add NET_ADMIN alpine sh -c \
            'ip route add 1.1.1.1 via 172.40.0.3 && ping -c 2 -W 2 1.1.1.1'
          echo "VPN-Image ok"

      - name: Logs bei Fehler
        if: failure()
        run: |
          docker logs wg-server || true
          docker logs vpn-client || true


  build:
    needs: [unit, e2e, dhcp, warp-image, vpn-image]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - { context: ".",      scope: buildkit, tag: latest, sha_prefix: "sha-" }
          - { context: vpn,      scope: vpn,      tag: vpn,    sha_prefix: "vpn-" }
          - { context: warp,     scope: warp,     tag: warp,   sha_prefix: "warp-" }
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}
          tags: |
            type=raw,value=${{ matrix.tag }}
            type=sha,prefix=${{ matrix.sha_prefix }}

      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          platforms: linux/arm64,linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.scope }}
          cache-to: type=gha,scope=${{ matrix.scope }},mode=max
